plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'org.utilitymanager'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    // Bukkit API
    compileOnly "org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT"
    
    // Adventure API for advanced text formatting
    api "net.kyori:adventure-api:4.17.0"
    api "net.kyori:adventure-platform-bukkit:4.3.2"
    api "net.kyori:adventure-text-minimessage:4.17.0"
    
    // Optional: Lombok for cleaner code
    compileOnly("org.projectlombok:lombok:1.18.30")
    annotationProcessor("org.projectlombok:lombok:1.18.30")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

// Maven publishing configuration
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            pom {
                name = 'UtilityManager'
                description = 'A comprehensive utility library for Minecraft plugin development'
                url = 'https://github.com/Foodust/UtilityManager'
                
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                
                developers {
                    developer {
                        id = 'utilitymanager'
                        name = 'Foodust'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/Foodust/UtilityManager.git'
                    developerConnection = 'scm:git:ssh://github.com:Foodust/UtilityManager.git'
                    url = 'https://github.com/Foodust/UtilityManager/tree/main'
                }
            }
        }
    }
}

// Source jar for better IDE support
java {
    withSourcesJar()
    withJavadocJar()
}

// Javadoc configuration
javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}